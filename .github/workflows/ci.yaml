name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth — the Makefile's lint target reads this pin.
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  # Test and Lint are required checks: gate them per job (a skipped job passes),
  # never with workflow-level `paths`, which would leave them pending forever.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          # Everything counts as source except top-level docs, so new file
          # types run CI by default.
          filters: |
            src:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!LICENSE*'

  test:
    name: Test
    needs: changes
    # Runs unless the filter explicitly said "no source changes": pushes to
    # main (filter skipped) and a failed filter both fall through to a full run.
    if: ${{ !cancelled() && needs.changes.outputs.src != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.src != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config=.golangci.yml -v
          skip-cache: 'true'